name: verify
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * *'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install
        run: pip install numpy scipy h5py
      - name: verification data present?
        id: data
        run: |
          if [ -d runs/snap_SYMa ]; then echo "ok=1" >> $GITHUB_OUTPUT
          else echo "ok=0" >> $GITHUB_OUTPUT
            echo "::notice::Verification data is not committed (~500MB of HDF5)."
            echo "::notice::Run boussinesq/bootstrap.sh locally (needs Dedalus, ~12 min), then verify.py."
          fi
      - name: static checks (always run)
        run: |
          python -c "import ast,sys,pathlib
bad=[]
for p in pathlib.Path('boussinesq').glob('*.py'):
    try: ast.parse(p.read_text())
    except SyntaxError as e: bad.append(f'{p}: {e}')
print('parsed', len(list(pathlib.Path('boussinesq').glob('*.py'))), 'modules')
sys.exit(1) if bad else None"
      - name: backwards proof
        if: steps.data.outputs.ok == '1'
        run: cd boussinesq && python verify.py
