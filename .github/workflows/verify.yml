name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install numpy scipy h5py
      - name: syntax check every module
        run: python -m compileall -q boussinesq
      - name: check for verification data
        id: data
        run: |
          if [ -d runs/snap_SYMa ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Verification data (~500MB HDF5) is not committed. Run boussinesq/bootstrap.sh locally, then verify.py."
          fi
      - name: backwards proof (15 checks)
        if: steps.data.outputs.ok == '1'
        run: cd boussinesq && python verify.py
